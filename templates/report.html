<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Market Bot | Report</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7ff}.page{max-width:1050px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{border:0;border-radius:16px;box-shadow:0 6px 20px rgba(15,23,42,.07)}.back{background:#2563eb;color:#fff;text-decoration:none;padding:9px 14px;border-radius:8px}</style></head>
<body><div class="page"><div class="head"><div><h1 class="text-primary">Market Report</h1><p class="text-muted">Four-marketplace catalog summary</p></div><a class="back" href="/dashboard">Dashboard</a></div><div class="card p-4"><table class="table table-hover align-middle"><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>{% for key,value in report.items() %}<tr><th>{{ key }}</th><td>{% if 'Price' in key %}₹{{ "{:,.2f}".format(value) }}{% elif 'Rating' in key %}★ {{ value }}{% elif 'Discount' in key %}{{ value }}%{% else %}{{ value }}{% endif %}</td></tr>{% endfor %}</tbody></table></div></div></body></html>
