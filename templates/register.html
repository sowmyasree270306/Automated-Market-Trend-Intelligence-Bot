<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5" style="max-width:500px;">

<h2 class="text-center mb-4">
Create Account
</h2>

<form action="/register" method="POST">

<div class="mb-3">

<input
type="text"
name="username"
class="form-control"
placeholder="Full Name"
required>

</div>

<div class="mb-3">

<input
type="email"
name="email"
class="form-control"
placeholder="Email"
required>

</div>

<div class="mb-3">

<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>

</div>

<button
class="btn btn-success w-100">

Register

</button>

</form>

<br>

<div class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</div>

</div>

</body>
</html>
